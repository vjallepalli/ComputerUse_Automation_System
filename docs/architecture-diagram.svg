<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="230" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">FIRST TIME — Discovery</text>
  <text x="230" y="54" text-anchor="middle" font-size="12" fill="#666666">AI is in the loop</text>

  <text x="770" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">EVERY TIME AFTER — Replay</text>
  <text x="770" y="54" text-anchor="middle" font-size="12" fill="#666666">No AI involved, ever</text>

  <line x1="500" y1="15" x2="500" y2="600" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Goal input (left) -->
  <rect x="90" y="75" width="280" height="46" rx="6" fill="#eef2ff" stroke="#4f5bd5" stroke-width="1.5"/>
  <text x="230" y="95" text-anchor="middle" font-size="12.5" fill="#1a1a1a">&#8220;Look up member 10003&#8217;s</text>
  <text x="230" y="111" text-anchor="middle" font-size="12.5" fill="#1a1a1a">savings balance&#8221;</text>

  <!-- Capability input (right) -->
  <rect x="630" y="75" width="280" height="46" rx="6" fill="#eef2ff" stroke="#4f5bd5" stroke-width="1.5"/>
  <text x="770" y="95" text-anchor="middle" font-size="12.5" fill="#1a1a1a">capability.json</text>
  <text x="770" y="111" text-anchor="middle" font-size="12.5" fill="#1a1a1a">+ member_number = 10002</text>

  <!-- arrow down to loop box (left) -->
  <line x1="230" y1="121" x2="230" y2="150" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- arrow down to replay box (right) -->
  <line x1="770" y1="121" x2="770" y2="150" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Observe/Decide/Act box (left) -->
  <rect x="90" y="150" width="280" height="92" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="172" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700">observe</tspan>  the page</text>
  <text x="110" y="192" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700">decide</tspan>  what to do</text>
  <text x="110" y="208" font-size="11" fill="#666666">(Claude, one action per turn)</text>
  <text x="110" y="228" font-size="12.5" fill="#1a1a1a"><tspan font-weight="700">act</tspan>  on the real browser</text>

  <!-- Replay execute box (right) -->
  <rect x="630" y="150" width="280" height="92" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="650" y="180" font-size="12.5" fill="#1a1a1a">same recorded steps</text>
  <text x="650" y="200" font-size="12.5" fill="#1a1a1a">re-run exactly, in order</text>
  <text x="650" y="222" font-size="13" font-weight="700" fill="#b3261e">NO model call</text>

  <!-- loop-back arrow (left, from bottom of action box around to top) -->
  <path d="M 90 210 C 40 210, 40 150, 90 150" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="18" y="184" font-size="10" fill="#666666" transform="rotate(-90 18 184)">repeats</text>

  <!-- arrow down to guardrail -->
  <line x1="230" y1="242" x2="230" y2="270" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Guardrail box, spans both columns, shared -->
  <rect x="90" y="270" width="820" height="110" rx="6" fill="#fff7e6" stroke="#b06f00" stroke-width="1.5"/>
  <text x="500" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4b00">GUARDRAIL CHECK — one shared check, called from BOTH sides, never duplicated</text>

  <rect x="115" y="305" width="330" height="60" rx="5" fill="#ffffff" stroke="#b06f00" stroke-width="1"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#1a1a1a">safe action</text>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#1a1a1a">→ runs automatically</text>

  <rect x="555" y="305" width="330" height="60" rx="5" fill="#ffffff" stroke="#b06f00" stroke-width="1"/>
  <text x="720" y="322" text-anchor="middle" font-size="12" fill="#1a1a1a">risky / sensitive action</text>
  <text x="720" y="340" text-anchor="middle" font-size="12" fill="#1a1a1a">→ STOP, hand the SAME live</text>
  <text x="720" y="356" text-anchor="middle" font-size="12" fill="#1a1a1a">browser to a human, then resume</text>

  <!-- guardrail feeds into replay's own execution too -->
  <path d="M 770 270 C 770 250, 770 250, 770 242" fill="none" stroke="#b06f00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowamber)"/>
  <text x="800" y="255" font-size="10" fill="#7a4b00">same check</text>

  <!-- arrow down from guardrail to record box (left) -->
  <line x1="230" y1="380" x2="230" y2="410" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Record capability box (left) -->
  <rect x="90" y="410" width="280" height="70" rx="6" fill="#eafbea" stroke="#1c7a1c" stroke-width="1.5"/>
  <text x="230" y="435" text-anchor="middle" font-size="12.5" fill="#1a1a1a">record the run as a typed,</text>
  <text x="230" y="453" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c7a1c">reusable Capability artifact</text>

  <!-- arrow down from replay outcome -->
  <line x1="770" y1="380" x2="770" y2="410" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result box (right) -->
  <rect x="630" y="410" width="280" height="70" rx="6" fill="#eafbea" stroke="#1c7a1c" stroke-width="1.5"/>
  <text x="770" y="435" text-anchor="middle" font-size="12.5" fill="#1a1a1a">success / business_outcome / failure</text>
  <text x="770" y="453" text-anchor="middle" font-size="11" fill="#666666">(typed, structured result)</text>

  <!-- long arrow: saved capability feeds into replay's input, across the gap -->
  <path d="M 370 445 C 500 445, 500 96, 628 96" fill="none" stroke="#1c7a1c" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowgreen)"/>
  <text x="500" y="470" text-anchor="middle" font-size="11" fill="#1c7a1c">saved once — reused forever, with new parameters, no AI call</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowamber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b06f00"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1c7a1c"/>
    </marker>
  </defs>

  <text x="500" y="600" text-anchor="middle" font-size="11" fill="#999999">Computer-Use Automation System — architecture overview</text>
</svg>
