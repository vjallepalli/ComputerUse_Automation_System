<svg width="1160" height="520" viewBox="0 0 1160 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1160" height="520" fill="#ffffff"/>

  <text x="580" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">The working thread — one goal, all the way through</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333333"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1c7a1c"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b06f00"/></marker>
  </defs>

  <!-- 1. Goal -->
  <rect x="20" y="90" width="150" height="70" rx="6" fill="#eef2ff" stroke="#4f5bd5" stroke-width="1.5"/>
  <text x="95" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">1. Goal</text>
  <text x="95" y="136" text-anchor="middle" font-size="10.5" fill="#444444">"look up member</text>
  <text x="95" y="149" text-anchor="middle" font-size="10.5" fill="#444444">10003's balance"</text>

  <line x1="170" y1="125" x2="205" y2="125" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2. LLM-driven run -->
  <rect x="205" y="80" width="180" height="90" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">2. LLM-driven run</text>
  <text x="295" y="120" text-anchor="middle" font-size="10.5" fill="#444444">Claude + Playwright</text>
  <text x="295" y="135" text-anchor="middle" font-size="10.5" fill="#444444">observe → decide → act</text>
  <text x="295" y="150" text-anchor="middle" font-size="10.5" fill="#444444">until the goal is met</text>

  <line x1="385" y1="125" x2="420" y2="125" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3. Capability artifact -->
  <rect x="420" y="85" width="170" height="80" rx="6" fill="#eafbea" stroke="#1c7a1c" stroke-width="1.5"/>
  <text x="505" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">3. Capability</text>
  <text x="505" y="123" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">artifact</text>
  <text x="505" y="141" text-anchor="middle" font-size="10.5" fill="#444444">typed, versioned,</text>
  <text x="505" y="154" text-anchor="middle" font-size="10.5" fill="#444444">saved once</text>

  <line x1="590" y1="125" x2="625" y2="125" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4. Deterministic replay -->
  <rect x="625" y="75" width="220" height="100" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="735" y="97" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">4. Deterministic replay</text>
  <text x="735" y="114" text-anchor="middle" font-size="10.5" fill="#b3261e" font-weight="700">no LLM call</text>
  <text x="735" y="131" text-anchor="middle" font-size="10.5" fill="#444444">new input params in</text>
  <text x="735" y="146" text-anchor="middle" font-size="10.5" fill="#444444">typed outputs +</text>
  <text x="735" y="161" text-anchor="middle" font-size="10.5" fill="#444444">error/outcome handling out</text>

  <line x1="845" y1="125" x2="880" y2="125" stroke="#333333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 6. Result -->
  <rect x="880" y="90" width="150" height="70" rx="6" fill="#eef2ff" stroke="#4f5bd5" stroke-width="1.5"/>
  <text x="955" y="114" text-anchor="middle" font-size="11.5" fill="#1a1a1a">success /</text>
  <text x="955" y="130" text-anchor="middle" font-size="11.5" fill="#1a1a1a">business_outcome /</text>
  <text x="955" y="146" text-anchor="middle" font-size="11.5" fill="#1a1a1a">failure</text>

  <!-- 5. Human escalation, branching from BOTH #2 and #4 -->
  <rect x="330" y="280" width="440" height="110" rx="6" fill="#fff7e6" stroke="#b06f00" stroke-width="1.5"/>
  <text x="550" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a4b00">5. Human escalation — the SAME live session, not a fresh one</text>
  <text x="550" y="326" text-anchor="middle" font-size="10.5" fill="#5a3d00">stuck / risky / needs sensitive data a person must supply</text>
  <text x="550" y="343" text-anchor="middle" font-size="10.5" fill="#5a3d00">→ pause automation, person takes over the open browser</text>
  <text x="550" y="360" text-anchor="middle" font-size="10.5" fill="#5a3d00">→ resume or reject, control handed back, run continues</text>

  <path d="M 295 170 C 295 230, 400 260, 420 280" fill="none" stroke="#b06f00" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#aa)"/>
  <text x="330" y="230" font-size="10" fill="#7a4b00">during discovery</text>

  <path d="M 735 175 C 735 230, 650 260, 620 280" fill="none" stroke="#b06f00" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#aa)"/>
  <text x="700" y="230" font-size="10" fill="#7a4b00">during replay</text>

  <!-- 6. Evidence, fed by BOTH #2 and #4 -->
  <rect x="330" y="420" width="440" height="70" rx="6" fill="#eafbea" stroke="#1c7a1c" stroke-width="1.5"/>
  <text x="550" y="445" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">6. Evidence — for BOTH runs</text>
  <text x="550" y="465" text-anchor="middle" font-size="10.5" fill="#444444">structured logs, DOM/screenshot snapshots, saved results</text>

  <path d="M 295 170 C 200 260, 200 400, 328 445" fill="none" stroke="#1c7a1c" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#ag)"/>
  <text x="150" y="300" font-size="10" fill="#1c7a1c">discovery evidence</text>

  <path d="M 955 160 C 1000 260, 1000 400, 772 452" fill="none" stroke="#1c7a1c" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#ag)"/>
  <text x="960" y="300" font-size="10" fill="#1c7a1c">replay evidence</text>

  <text x="580" y="510" text-anchor="middle" font-size="10.5" fill="#999999">Every box above is demonstrated live in /evidence/ — not just built, run.</text>
</svg>
